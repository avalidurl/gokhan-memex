name: Refresh GitHub sitemap

on:
  push:
    branches: [main]
    paths:
      - "src/content/blog/**"
      - "public/rss.xml"
      - "functions/rss.xml.js"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild avalidurl.github.io from the live journal
        env:
          GH_TOKEN: ${{ secrets.SITEMAP_DISPATCH_TOKEN }}
        run: gh api repos/avalidurl/avalidurl.github.io/dispatches -f event_type=journal-post
