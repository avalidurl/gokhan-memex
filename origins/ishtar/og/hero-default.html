<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#f7f7f5; --ink:#0a0a0a; --red:#e10600; --mut:#6a6a6a; --line:#0a0a0a; }
  *{ box-sizing:border-box; margin:0; }
  html,body{ background:#e7e7e7; }
  /* 1200x630 OG card — numetal datasheet register, Ishtar tokens. LANDING / product definition. */
  .og{ width:1200px; height:630px; background:var(--bg); position:relative; overflow:hidden;
       font-family:"Archivo",system-ui,sans-serif; color:var(--ink); }
  .frame{ position:absolute; inset:24px; border:1.5px solid var(--line); }
  .pad{ position:absolute; inset:24px; padding:46px 60px 54px; display:flex; flex-direction:column; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .swatch{ width:22px; height:22px; background:var(--red); }
  .wm{ font-family:"Geist Mono",monospace; font-weight:700; font-size:25px; letter-spacing:.14em; }
  .wm .hrt{ color:var(--red); }
  .kick{ font-family:"Geist Mono",monospace; font-size:16px; letter-spacing:.2em; text-transform:uppercase;
         color:var(--mut); margin-top:16px; }
  .kick b{ color:var(--red); font-weight:700; }
  .h{ margin-top:auto; }
  .title{ font-weight:800; font-size:78px; line-height:.98; letter-spacing:-.025em; }
  .title .red{ color:var(--red); }
  .body{ font-size:22px; line-height:1.42; color:#2a2a2a; max-width:680px; margin-top:22px; }
  .body b{ color:var(--ink); font-weight:700; }
  .foot{ display:flex; justify-content:space-between; align-items:flex-end; margin-top:34px; }
  .url{ font-family:"Geist Mono",monospace; font-weight:700; font-size:23px; color:var(--red); letter-spacing:.01em; }
  .tags{ font-family:"Geist Mono",monospace; font-size:15px; letter-spacing:.13em; text-transform:uppercase; color:var(--mut); }
  /* red/white candy stripe — matches site .stripe (135deg diagonal) */
  .stripe{ position:absolute; left:0; right:0; bottom:0; height:14px;
           background-image:repeating-linear-gradient(135deg, var(--red) 0 11px, #ffffff 11px 22px); }
</style><link rel="canonical" href="https://gokhanturhan.com/ishtar/og/hero-default/">
<style>.gt-bar{all:initial;display:block;box-sizing:border-box;width:100%;min-height:32px;border-bottom:1px solid #1a1a1a;background:#ffffff;color:#1a1a1a;font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:6px 14px;letter-spacing:.02em;z-index:9999;position:relative}
.gt-bar a{color:#002fa7;text-decoration:none}.gt-bar a:hover{text-decoration:underline}.gt-bar b{font-weight:600}
@media (prefers-color-scheme:dark){.gt-bar{background:#1a1a1a;color:#f5f5f5;border-color:#f5f5f5}.gt-bar a{color:#8eb0ff}}</style>
</head>
